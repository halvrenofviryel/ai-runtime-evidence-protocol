name: K7 partial evidence review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  partial-and-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.6'
      - name: Install existing hash-locked dependencies
        run: python -m pip install --require-hashes -r integrations/langgraph/durable/requirements.lock
      - name: Materialize existing offline Node dependency
        run: python spec/airep/v0.2/class-verification/offline-node-deps/materialize_node_modules.py
      - name: New partial-evidence tests and original runtime regressions
        run: python -B -m unittest discover -s integrations/langgraph/multitarget/tests -v
      - name: Generate and exactly replay authored partial-evidence fixtures
        run: |
          python -B -m integrations.langgraph.multitarget.partial_report --out "$RUNNER_TEMP/k7-partial-generated"
          python -B -m integrations.langgraph.multitarget.partial_report --replay "$RUNNER_TEMP/k7-partial-generated/inputs.json" --out "$RUNNER_TEMP/k7-partial-replayed"
          cmp "$RUNNER_TEMP/k7-partial-generated/inputs.json" "$RUNNER_TEMP/k7-partial-replayed/inputs.json"
          cmp "$RUNNER_TEMP/k7-partial-generated/report.json" "$RUNNER_TEMP/k7-partial-replayed/report.json"
