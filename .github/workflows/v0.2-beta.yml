name: v0.2 beta implementation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.6'
      - name: Historical v0.1 pytest runner dependencies
        run: python3 -m pip install pytest==9.0.2 jsonschema==4.25.1 cryptography==48.0.0
      - name: Frozen reproduction, imported W1 checks, beta producer and reconciliation
        run: python3 scripts/check_beta.py --out "$RUNNER_TEMP/airep-beta-results"
      - name: Retain every command result, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airep-v0.2-beta-evidence
          path: ${{ runner.temp }}/airep-beta-results
          if-no-files-found: error
