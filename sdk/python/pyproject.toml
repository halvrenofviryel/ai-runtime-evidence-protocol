[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airep-sdk"
version = "0.1.0a2"
description = "Experimental installable AIREP v0.2 beta tools and bounded LangGraph hooks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0 AND CC-BY-4.0"}
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3.12"]
dependencies = ["cryptography==48.0.0", "jsonschema==4.25.1", "referencing==0.37.0"]

[project.optional-dependencies]
langgraph = ["langgraph==1.2.19", "langgraph-checkpoint==4.3.1", "langchain-core==1.7.4"]

[project.scripts]
airep = "airep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["airep*"]
namespaces = false

[tool.setuptools.package-data]
airep = ["_basis/**/*", "SOURCE_MANIFEST.json", "CONSUMER_CONTRACT.json", "NOTICE.txt", "LICENSE*", "requirements.lock"]
